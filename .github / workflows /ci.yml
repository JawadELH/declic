name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests du moteur (stats, risque, notifications)
        run: npm test
      - name: Build du front
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
      - name: Vérification des Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run check
